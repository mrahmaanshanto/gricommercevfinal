<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receive goods on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:#e9eef5;color:#1e293b;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#003087}a:hover{color:#002a77}
.card{background:#ffffff;border-radius:12px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:#475569;font-size:14px;font-weight:500;letter-spacing:.01em;text-decoration:none;transition:background-color 200ms cubic-bezier(0,0,.2,1),color 300ms ease-in-out}
.nav:hover{background:#f1f5f9;color:#0f172a;text-decoration:none}
.nav.on{background:rgba(0,48,135,.08);color:#003087}
.navh{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;color:#64748b;padding:18px 12px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:8px;border:0;font:inherit;font-size:14px;font-weight:500;letter-spacing:.025em;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color 200ms cubic-bezier(0,0,.2,1),color 200ms,border-color 200ms}
.btn:hover{text-decoration:none}
.btn:focus-visible,.nav:focus-visible,.ib:focus-visible,.tab:focus-visible,.chip:focus-visible,.step:focus-visible{outline:3px solid rgba(0,48,135,.5);outline-offset:2px}
.solid{background:#003087;color:#fff}.solid:hover{background:#002a77;color:#fff}
.soft{background:rgba(0,48,135,.08);color:#003087}.soft:hover{background:rgba(0,48,135,.16);color:#003087}
.line{background:#fff;color:#1e293b;border:1px solid #cbd5e1}.line:hover{background:#f1f5f9;color:#1e293b}
.warnbtn{background:#b45309;color:#fff}.warnbtn:hover{background:#92400e;color:#fff}
.big{height:52px;padding:0 24px;font-size:15px}
.sm{height:36px;padding:0 12px;font-size:13px}
.ib{width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:#475569;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background-color 200ms}
.ib:hover{background:rgba(203,213,225,.35);color:#0f172a}
.inp{width:100%;height:44px;padding:0 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit;font-size:14px;color:#1e293b;transition:border-color 200ms}
.inp:hover{border-color:#94a3b8}.inp:focus{outline:none;border-color:#003087}
.inp::placeholder{color:#64748b}
.lbl{font-size:13px;line-height:18px;font-weight:500;color:#334155}
.tab{height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#475569;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background-color 200ms,color 200ms}
.tab:hover{background:#f1f5f9;color:#0f172a}
.tab.on{background:#003087;color:#fff}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font:inherit;font-size:13px;font-weight:500;color:#334155;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background-color 200ms,border-color 200ms,color 200ms}
.chip:hover{border-color:#94a3b8}
.chip.on{border-color:#003087;background:rgba(0,48,135,.08);color:#003087}
.th{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.025em;text-transform:uppercase;color:#64748b;text-align:left;padding:12px 16px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.td{padding:14px 16px;border-bottom:1px solid #eef2f6;font-size:14px;line-height:20px;vertical-align:middle}
.row{transition:background-color 200ms}.row:hover{background:#f8fafc}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.b-draft{background:#eef2f6;color:#475569}.b-approval{background:#fff4e0;color:#a14f06}.b-approved{background:#e0f2fe;color:#075985}
.b-ordered{background:rgba(0,48,135,.08);color:#003087}.b-partial{background:#fff1e6;color:#b4410c}.b-received{background:#e7f8f1;color:#047857}
.b-closed{background:#e2e8f0;color:#334155}.b-cancelled{background:#ffece6;color:#b83210}.b-over{background:#ffece6;color:#b83210}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.fade{animation:gcFade 260ms cubic-bezier(0,0,.2,1)}
@keyframes gcFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.flash{animation:gcFlash 900ms ease-out}
@keyframes gcFlash{from{background:#e7f8f1}to{background:transparent}}
.scanline{animation:gcScan 1.8s ease-in-out infinite alternate}
@keyframes gcScan{from{transform:translateY(0)}to{transform:translateY(150px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #f8fafc; display: flex; flex-direction: column; overflow: hidden;">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 8px; background: #ffffff; border-bottom: 1px solid #e2e8f0;">
<a class="ib" href="ReceiveGoods.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; min-width: 0;"><div style="font-size: 17px; line-height: 24px; font-weight: 700; color: #0f172a;">Receive goods</div><div class="mono" style="font-size: 12px; line-height: 16px; color: #64748b;">PO-2609-0020 · Nabil Fashion House</div></div>
<button type="button" class="ib" aria-label="Scan from a photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg></button>
</header>
<button type="button" onClick="{{scan}}" aria-label="Scan a barcode" style="position: relative; flex-shrink: 0; height: 250px; margin: 0; border: 0; padding: 0; background: #0b1220; cursor: pointer; overflow: hidden; font: inherit;">
<span style="position: absolute; left: 55px; top: 40px; width: 280px; height: 170px; border-radius: 16px; border: 2px solid rgba(255,255,255,.85);"></span>
<span class="scanline" style="position: absolute; left: 70px; top: 50px; width: 250px; height: 2px; background: #009cde; box-shadow: 0 0 12px 2px rgba(0,156,222,.8);"></span>
<span style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; color: rgba(255,255,255,.85);">Point the camera at a barcode · tap to try</span>
</button>
<div style="flex-shrink: 0; padding: 14px 16px 0;">
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{ true }}"><div class="fade" role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: {{msgBg}}; color: {{msgFg}};"><span style="flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg></span><div style="min-width: 0;"><div style="font-size: 14px; line-height: 20px; font-weight: 600;">{{msgTitle}}</div><div style="font-size: 12px; line-height: 16px;">{{msgSub}}</div></div></div></sc-if>
</div>
<div style="flex-shrink: 0; display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 8px;"><span style="font-size: 14px; font-weight: 600; color: #0f172a;">This delivery</span><span style="font-size: 13px; color: #475569;"><strong style="font-size: 18px; color: #0f172a;">{{got}}</strong> of {{pending}} pieces</span></div>
<div style="flex-grow: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
<div class="{{l.cls}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #ffffff; box-shadow: 0 3px 10px 0 rgba(48,46,56,.06);">
<div style="flex-grow: 1; min-width: 0;"><div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #0f172a;">{{l.name}}</div><div style="font-size: 12px; line-height: 16px; color: {{l.subColor}};">{{l.sub}}</div></div>
<div style="font-size: 20px; font-weight: 700; color: #0f172a; min-width: 64px; text-align: right;">{{l.got}}<span style="font-size: 13px; font-weight: 500; color: #64748b;">/{{l.pending}}</span></div>
</div>
</sc-for>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 20px; background: #ffffff; border-top: 1px solid #e2e8f0;">
<button type="button" class="btn solid big" style="width: 100%; height: 56px; font-size: 16px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Save delivery</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var RC = [
  { name: 'Men’s Polo Shirt · Navy · M', pending: 20 },
  { name: 'Men’s Polo Shirt · Navy · L', pending: 20 },
  { name: 'Denim Jeans · Blue · 32', pending: 10 },
  { name: 'Denim Jeans · Blue · 34', pending: 10 },
  { name: 'Cotton T-shirt · Black · M', pending: 40 }
];
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    var self = this, s = this.state || {};
    var got = s.got || [20, 12, 6, 4, 1];
    var n = s.n || 0;
    var last = s.last != null ? s.last : 4;
    var total = got.reduce(function (a, b) { return a + b; }, 0);
    var pend = RC.reduce(function (a, r) { return a + r.pending; }, 0);
    var lines = RC.map(function (r, i) {
      var g = got[i], full = g >= r.pending;
      return { name: r.name, got: g, pending: r.pending, sub: full ? 'All here' : (r.pending - g) + ' still to scan', subColor: full ? '#047857' : '#64748b', cls: s.flash === i ? 'flash' : '' };
    });
    var bad = !!s.bad;
    return {
      lines: lines, got: total, pending: pend,
      hasMsg: true, msgBg: bad ? '#ffece6' : '#e7f8f1', msgFg: bad ? '#8a2a0c' : '#065f46',
      msgTitle: bad ? 'Not on this order' : 'Beep — +1 added',
      msgSub: bad ? 'Put this item aside and tell the manager.' : RC[last].name,
      scan: function () {
        clearTimeout(self.t);
        if (n % 5 === 4) { self.setState({ n: n + 1, bad: true, flash: null }); }
        else { var order = [4, 1, 2, 3, 4]; var i = order[n % order.length]; var g = got.slice(); g[i]++; self.setState({ got: g, n: n + 1, last: i, bad: false, flash: i }); }
        self.t = setTimeout(function () { self.setState({ flash: null }); }, 900);
      }
    };
  }
}
</script>
</body>
</html>
