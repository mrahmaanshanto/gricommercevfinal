<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script><script src="../_shell/gc-topbar.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="/_blob/1840c8d9327e1d872bcd8bc9a4590a5a"></script></helmet>
<div style="width:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;font-family:Poppins,'Hind Siliguri',ui-sans-serif,system-ui,sans-serif;color:#475569">
<section style="display:flex;flex-direction:column;gap:16px;border-radius:8px;background:#fff;padding:18px 20px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<div style="flex:1;min-width:180px"><h2 style="margin:0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ t.title }}</h2><p style="margin:2px 0 0;font-size:12.5px;color:#64748b">{{ meta }}</p></div>
<button type="button" style="display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:0 12px;font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.025em;color:#475569;cursor:pointer" style-hover="background:#f1f5f9"><i data-lucide="download" width="14" height="14"></i>{{ t.export }}</button>
</div>
<div role="group" aria-label="{{ t.filterLabel }}" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="8">
<sc-if value="{{ f.on }}">
<button type="button" onClick="{{ f.act }}" aria-pressed="true" style="display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid rgba(0,48,135,.25);border-radius:9999px;background:rgba(0,48,135,.1);padding:0 12px;font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.025em;cursor:pointer;color:#003087"><i data-lucide="{{ f.icon }}" width="13" height="13"></i>{{ f.label }}<span style="font-variant-numeric:tabular-nums;opacity:.7">{{ f.count }}</span></button>
</sc-if>
<sc-if value="{{ f.off }}">
<button type="button" onClick="{{ f.act }}" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid #e2e8f0;border-radius:9999px;background:#fff;padding:0 12px;font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.025em;cursor:pointer;color:#475569" style-hover="background:#f1f5f9;color:#1e293b"><i data-lucide="{{ f.icon }}" width="13" height="13"></i>{{ f.label }}<span style="font-variant-numeric:tabular-nums;opacity:.7">{{ f.count }}</span></button>
</sc-if>
</sc-for>
</div>
<ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column">
<sc-for list="{{ items }}" as="a" hint-placeholder-count="10">
<li style="display:flex;align-items:stretch;gap:14px">
<span style="display:flex;flex-direction:column;align-items:center;flex:none;width:32px">
<span style="display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9999px;background:#f1f5f9;color:#475569"><i data-lucide="{{ a.icon }}" width="15" height="15"></i></span>
<sc-if value="{{ a.notLast }}"><span style="flex:1;width:2px;background:#e2e8f0"></span></sc-if>
</span>
<div style="flex:1;min-width:0;padding-bottom:18px">
<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
<p style="margin:0;flex:1;min-width:200px;font-size:13.5px;font-weight:500;color:#1e293b;text-wrap:pretty">{{ a.text }}</p>
<span style="font-size:12px;color:#94a3b8;white-space:nowrap;font-variant-numeric:tabular-nums">{{ a.when }}</span>
</div>
<p style="margin:3px 0 0;font-size:12.5px;line-height:19px;color:#64748b;text-wrap:pretty">{{ a.detail }}</p>
<div style="display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap">
<sc-for list="{{ a.tags }}" as="g" hint-placeholder-count="2">
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;border-radius:9999px;background:#f1f5f9;padding:0 9px;font-size:11.5px;font-weight:500;color:#475569">{{ g.label }}</span>
</sc-for>
</div>
</div>
</li>
</sc-for>
</ol>
<button type="button" style="align-self:flex-start;height:36px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:0 15px;font-family:inherit;font-size:13.5px;font-weight:500;letter-spacing:.025em;color:#475569;cursor:pointer" style-hover="background:#f1f5f9">{{ t.loadMore }}</button>
</section>
<aside style="display:flex;flex-direction:column;gap:16px">
<section style="display:flex;flex-direction:column;gap:12px;border-radius:8px;background:#fff;padding:18px 20px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ t.sessionsTitle }}</h2>
<sc-for list="{{ sessions }}" as="s" hint-placeholder-count="3">
<div style="display:flex;align-items:flex-start;gap:10px">
<i data-lucide="{{ s.icon }}" width="17" height="17" style="flex:none;margin-top:2px;color:#64748b"></i>
<div style="min-width:0"><p style="margin:0;font-size:12.5px;font-weight:500;color:#1e293b">{{ s.device }}</p><p style="margin:1px 0 0;font-size:11.5px;line-height:17px;color:#94a3b8;text-wrap:pretty">{{ s.meta }}</p></div>
</div>
</sc-for>
</section>
<section style="display:flex;flex-direction:column;gap:11px;border-radius:8px;background:#fff;padding:18px 20px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)">
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ t.countsTitle }}</h2>
<sc-for list="{{ counts }}" as="c" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:10px">
<span style="flex:1;font-size:12.5px;color:#64748b">{{ c.label }}</span>
<span style="font-size:13px;font-weight:600;color:#1e293b;font-variant-numeric:tabular-nums">{{ c.value }}</span>
</div>
</sc-for>
<p style="margin:0;font-size:11.5px;line-height:17px;color:#94a3b8;text-wrap:pretty">{{ t.countsNote }}</p>
</section>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;bn&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en' | 'bn'&quot;}}">
class Component extends DCLogic {
  state = { filter: 'all' };
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() {
    const go = () => { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }); };
    go(); setTimeout(go, 200); setTimeout(go, 700); setTimeout(go, 2000);
  }
  renderVals() {
    const bn = (this.props.lang ?? 'en') === 'bn';
    const L = (en, b) => bn ? b : en;
    const tone = { login: 'log-in', order: 'shopping-bag', sale: 'receipt', discount: 'percent', refund: 'rotate-ccw', approval: 'check-check', perm: 'shield-check' };
    const ALL = [
      ['sale', L('Confirmed counter sale #GC-24118', 'কাউন্টার বিক্রি #GC-24118 নিশ্চিত'), L('৳2,340 · cash · 4 items · Dhanmondi-1', '৳২,৩৪০ · ক্যাশ · ৪টি পণ্য · ধানমন্ডি-১'), L('16 Sep, 12:04 PM', '১৬ সেপ, ১২:০৪ PM'), [L('POS', 'POS'), L('Cash', 'ক্যাশ')]],
      ['discount', L('Applied 5% discount on #GC-24116', '#GC-24116-এ ৫% ছাড়'), L('৳180 off ৳3,600 · within her 5% limit · no approval needed', '৳৩,৬০০-এ ৳১৮০ ছাড় · ৫% সীমার মধ্যে · অনুমোদন লাগেনি'), L('16 Sep, 11:41 AM', '১৬ সেপ, ১১:৪১ AM'), [L('Within limit', 'সীমার মধ্যে')]],
      ['order', L('Confirmed online order #GC-24109', 'অনলাইন অর্ডার #GC-24109 নিশ্চিত'), L('Facebook order · Mirpur · cash on delivery ৳1,250', 'ফেসবুক অর্ডার · মিরপুর · ক্যাশ অন ডেলিভারি ৳১,২৫০'), L('16 Sep, 10:58 AM', '১৬ সেপ, ১০:৫৮ AM'), [L('Online', 'অনলাইন')]],
      ['login', L('Signed in at POS Dhanmondi-1', 'POS ধানমন্ডি-১-এ সাইন ইন'), L('Android tablet · PIN · IP 103.108.x.x · two-factor passed', 'অ্যান্ড্রয়েড ট্যাব · পিন · IP 103.108.x.x · দুই স্তর সফল'), L('16 Sep, 9:56 AM', '১৬ সেপ, ৯:৫৬ AM'), [L('Two-factor', 'দুই স্তর')]],
      ['refund', L('Requested refund on #GC-24061', '#GC-24061-এ ফেরতের অনুরোধ'), L('৳1,200 · above her ৳2,000 limit? no · sent to Nusrat Jahan anyway (damaged item)', '৳১,২০০ · সীমার মধ্যে · তবু নুসরাত জাহানের কাছে পাঠানো (ক্ষতিগ্রস্ত পণ্য)'), L('15 Sep, 5:22 PM', '১৫ সেপ, ৫:২২ PM'), [L('Pending approval', 'অনুমোদনের অপেক্ষায়')]],
      ['approval', L('Overtime approved by Nusrat Jahan', 'নুসরাত জাহান ওভারটাইম অনুমোদন করেছেন'), L('2.2 hours on 10 Sep · Eid rush at the counter', '১০ সেপ ২.২ ঘণ্টা · ঈদের ভিড়'), L('11 Sep, 10:15 AM', '১১ সেপ, ১০:১৫ AM'), [L('Attendance', 'হাজিরা')]],
      ['perm', L('Ashiq Khan set max discount to 5%', 'আশিক খান সর্বোচ্চ ছাড় ৫% করেছেন'), L('Was 3% · personal override on the Cashier role', 'আগে ৩% · ক্যাশিয়ার রোলে ব্যক্তিগত ওভাররাইড'), L('02 Sep, 4:12 PM', '০২ সেপ, ৪:১২ PM'), [L('Permission change', 'অনুমতি পরিবর্তন'), L('By owner', 'মালিক কর্তৃক')]],
      ['sale', L('Closed cash drawer · ৳18,420 counted', 'ক্যাশ ড্রয়ার বন্ধ · ৳১৮,৪২০ গণনা'), L('Expected ৳18,420 · no variance · deposited to bKash merchant', 'প্রত্যাশিত ৳১৮,৪২০ · কোনো গরমিল নেই · বিকাশ মার্চেন্টে জমা'), L('15 Sep, 6:24 PM', '১৫ সেপ, ৬:২৪ PM'), [L('Cash', 'ক্যাশ')]],
      ['perm', L('Nusrat Jahan blocked POS returns', 'নুসরাত জাহান POS ফেরত বন্ধ করেছেন'), L('Delete on POS turned off for all cashiers after a stock mismatch', 'স্টক গরমিলের পর সব ক্যাশিয়ারের POS ডিলিট বন্ধ'), L('18 Aug, 11:03 AM', '১৮ আগ, ১১:০৩ AM'), [L('Permission change', 'অনুমতি পরিবর্তন')]],
      ['login', L('Signed in from Chrome on Windows', 'উইন্ডোজ ক্রোম থেকে সাইন ইন'), L('New device · SMS code verified · owner alerted', 'নতুন ডিভাইস · SMS কোড যাচাই · মালিককে জানানো হয়েছে'), L('14 Sep, 6:10 PM', '১৪ সেপ, ৬:১০ PM'), [L('New device', 'নতুন ডিভাইস')]]
    ];
    const FILTERS = [
      ['all', L('All', 'সব'), 'list'], ['login', L('Logins', 'লগইন'), 'log-in'], ['order', L('Orders', 'অর্ডার'), 'shopping-bag'],
      ['sale', L('Sales', 'বিক্রয়'), 'receipt'], ['discount', L('Discounts', 'ছাড়'), 'percent'], ['refund', L('Refunds', 'ফেরত'), 'rotate-ccw'],
      ['approval', L('Approvals', 'অনুমোদন'), 'check-check'], ['perm', L('Permission changes', 'অনুমতি পরিবর্তন'), 'shield-check']
    ];
    const f = this.state.filter;
    const shown = ALL.filter(r => f === 'all' || r[0] === f);
    return {
      t: {
        title: L('Activity log', 'কার্যক্রমের লগ'), export: L('Export CSV', 'CSV এক্সপোর্ট'), filterLabel: L('Filter by type', 'ধরন অনুযায়ী ফিল্টার'),
        loadMore: L('Load 30 more entries', 'আরও ৩০টি দেখুন'),
        sessionsTitle: L('Sessions and devices', 'সেশন ও ডিভাইস'),
        countsTitle: L('September so far', 'সেপ্টেম্বর এখন পর্যন্ত'),
        countsNote: L('Counted from her own actions only. Actions taken by a manager on her behalf appear with the manager\u2019s name.', 'শুধু তাঁর নিজের কাজ গণনা করা হয়েছে। ম্যানেজার তাঁর পক্ষে কিছু করলে ম্যানেজারের নামে দেখাবে।')
      },
      meta: L(shown.length + ' of 312 entries · last 30 days · Asia/Dhaka', '৩১২টির মধ্যে ' + shown.length + 'টি · শেষ ৩০ দিন · এশিয়া/ঢাকা'),
      filters: FILTERS.map(([key, label, icon]) => {
        const on = f === key;
        const count = key === 'all' ? ALL.length : ALL.filter(r => r[0] === key).length;
        return { label, icon, count: String(count), on, off: !on, act: () => this.setState({ filter: key }) };
      }),
      items: shown.map(([kind, text, detail, when, tags], i) => ({
        text, detail, when,
        icon: tone[kind],
        notLast: i !== shown.length - 1,
        tags: tags.map(label => ({ label }))
      })),
      sessions: [
        { device: L('POS Dhanmondi-1', 'POS ধানমন্ডি-১'), meta: L('Android tablet · signed in now · since 9:56 AM', 'অ্যান্ড্রয়েড ট্যাব · এখন সাইন-ইন · ৯:৫৬ AM থেকে'), icon: 'tablet' },
        { device: L('GridCommerce app', 'গ্রিডকমার্স অ্যাপ'), meta: L('Redmi Note 12 · last active 16 Sep, 8:40 AM', 'রেডমি নোট ১২ · শেষ সক্রিয় ১৬ সেপ, ৮:৪০ AM'), icon: 'smartphone' },
        { device: L('Chrome on Windows', 'উইন্ডোজ ক্রোম'), meta: L('Shop back office · last active 14 Sep, 6:10 PM', 'দোকানের অফিস · শেষ সক্রিয় ১৪ সেপ, ৬:১০ PM'), icon: 'monitor' }
      ],
      counts: [
        { label: L('Sales entered', 'বিক্রয় এন্ট্রি'), value: '184' },
        { label: L('Online orders confirmed', 'অনলাইন অর্ডার নিশ্চিত'), value: '46' },
        { label: L('Discounts applied', 'ছাড় দেওয়া'), value: '23' },
        { label: L('Refunds requested', 'ফেরতের অনুরোধ'), value: '3' },
        { label: L('Logins', 'লগইন'), value: '19' }
      ]
    };
  }
}
</script>
</body>
</html>
