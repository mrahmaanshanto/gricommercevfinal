<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script><script src="../_shell/gc-topbar.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="/_blob/1840c8d9327e1d872bcd8bc9a4590a5a"></script></helmet>
<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;font-family:Poppins,'Hind Siliguri',ui-sans-serif,system-ui,sans-serif;color:#475569">
<header style="flex:none;display:flex;align-items:center;gap:14px;height:56px;padding:0 24px;border-bottom:1px solid #e2e8f0;background:#fff">
<span style="display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:8px;background:#003087;font-size:14px;font-weight:600;color:#fff">G</span>
<div style="flex:1;min-width:0"><p style="margin:0;font-size:14px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ t.title }}</p><p style="margin:0;font-size:12px;color:#64748b">{{ stepMeta }}</p></div>
<button type="button" onClick="{{ draft }}" style="display:inline-flex;align-items:center;gap:7px;height:34px;flex:none;border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:0 13px;font-family:inherit;font-size:13px;font-weight:500;letter-spacing:.025em;color:#475569;cursor:pointer" style-hover="background:#f1f5f9"><i data-lucide="save" width="15" height="15"></i>{{ draftLabel }}</button>
<button type="button" onClick="{{ close }}" aria-label="{{ t.close }}" style="width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#64748b;cursor:pointer" style-hover="background:#f1f5f9;color:#1e293b"><i data-lucide="x" width="17" height="17"></i></button>
</header>
<div style="flex:none;background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px">
<ol style="margin:0 auto;padding:0;list-style:none;max-width:1000px;display:flex;align-items:center;gap:0">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="7">
<li style="flex:1;min-width:0;display:flex;align-items:center;gap:8px">
<button type="button" onClick="{{ s.act }}" aria-current="{{ s.current }}" style="display:flex;align-items:center;gap:9px;min-width:0;border:none;background:none;padding:0;font-family:inherit;text-align:left;cursor:pointer">
<sc-if value="{{ s.done }}">
<span style="display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:9999px;border:1px solid #003087;background:#003087;font-size:12.5px;font-weight:600;color:#fff"><i data-lucide="check" width="14" height="14"></i></span>
<span style="min-width:0;display:block"><span style="display:block;font-size:12.5px;font-weight:500;letter-spacing:.025em;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.label }}</span></span>
</sc-if>
<sc-if value="{{ s.active }}" hint-placeholder-val="{{ true }}">
<span style="display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:9999px;border:1px solid rgba(0,48,135,.25);background:rgba(0,48,135,.1);font-size:12.5px;font-weight:600;color:#003087">{{ s.n }}</span>
<span style="min-width:0;display:block"><span style="display:block;font-size:12.5px;font-weight:600;letter-spacing:.025em;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.label }}</span></span>
</sc-if>
<sc-if value="{{ s.todo }}">
<span style="display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:9999px;border:1px solid #e2e8f0;background:#fff;font-size:12.5px;font-weight:600;color:#94a3b8">{{ s.n }}</span>
<span style="min-width:0;display:block"><span style="display:block;font-size:12.5px;font-weight:500;letter-spacing:.025em;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.label }}</span></span>
</sc-if>
</button>
<sc-if value="{{ s.lineDone }}"><span style="flex:1;min-width:8px;height:2px;border-radius:2px;background:#003087"></span></sc-if>
<sc-if value="{{ s.lineTodo }}"><span style="flex:1;min-width:8px;height:2px;border-radius:2px;background:#e2e8f0"></span></sc-if>
</li>
</sc-for>
</ol>
</div>
<div style="flex:1;min-height:0;overflow:auto;padding:24px">
<div style="max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px">
<sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ sections }}" as="sec" hint-placeholder-count="2">
<section style="display:flex;flex-direction:column;gap:16px;border-radius:8px;background:#fff;padding:20px 22px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)">
<div>
<h2 style="margin:0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ sec.title }}</h2>
<p style="margin:2px 0 0;font-size:12.5px;line-height:19px;color:#64748b;text-wrap:pretty">{{ sec.help }}</p>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
<sc-for list="{{ sec.fields }}" as="f" hint-placeholder-count="6">
<sc-if value="{{ f.wide }}">
<label style="display:block;grid-column:span 2">
<span style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px"><span style="font-size:12.5px;font-weight:500;letter-spacing:.025em;color:#1e293b">{{ f.label }}</span><span style="font-size:11.5px;color:#c2410c">{{ f.req }}</span></span>
<input type="text" value="{{ f.value }}" placeholder="{{ f.placeholder }}" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 11px;font-family:inherit;font-size:13.5px;color:#1e293b" style-focus="border-color:#003087">
<sc-if value="{{ f.hasHelp }}"><span style="display:block;margin-top:5px;font-size:11.5px;line-height:17px;color:#64748b;text-wrap:pretty">{{ f.help }}</span></sc-if>
</label>
</sc-if>
<sc-if value="{{ f.narrow }}" hint-placeholder-val="{{ true }}">
<label style="display:block">
<span style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px"><span style="font-size:12.5px;font-weight:500;letter-spacing:.025em;color:#1e293b">{{ f.label }}</span><span style="font-size:11.5px;color:#c2410c">{{ f.req }}</span></span>
<sc-if value="{{ f.isText }}">
<input type="text" value="{{ f.value }}" placeholder="{{ f.placeholder }}" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 11px;font-family:inherit;font-size:13.5px;color:#1e293b" style-focus="border-color:#003087">
</sc-if>
<sc-if value="{{ f.isSelect }}">
<select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 9px;font-family:inherit;font-size:13.5px;color:#1e293b;cursor:pointer" style-focus="border-color:#003087">
<sc-for list="{{ f.options }}" as="o" hint-placeholder-count="3">
<option>{{ o.label }}</option>
</sc-for>
</select>
</sc-if>
<sc-if value="{{ f.isSeg }}">
<span style="display:inline-flex;align-items:center;gap:2px;height:36px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:3px">
<sc-for list="{{ f.segs }}" as="g" hint-placeholder-count="2">
<sc-if value="{{ g.on }}">
<button type="button" onClick="{{ g.act }}" aria-pressed="true" style="height:28px;border:none;border-radius:6px;padding:0 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:#1e293b;box-shadow:0 1px 2px 0 rgba(48,46,56,.08)">{{ g.label }}</button>
</sc-if>
<sc-if value="{{ g.off }}">
<button type="button" onClick="{{ g.act }}" aria-pressed="false" style="height:28px;border:none;border-radius:6px;padding:0 12px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;background:transparent;color:#64748b" style-hover="color:#1e293b">{{ g.label }}</button>
</sc-if>
</sc-for>
</span>
</sc-if>
<sc-if value="{{ f.hasHelp }}"><span style="display:block;margin-top:5px;font-size:11.5px;line-height:17px;color:#64748b;text-wrap:pretty">{{ f.help }}</span></sc-if>
</label>
</sc-if>
</sc-for>
</div>
</section>
</sc-for>
</sc-if>
<sc-if value="{{ isReview }}">
<div style="display:flex;align-items:center;gap:12px;border-radius:8px;background:rgba(0,48,135,.06);padding:16px 18px">
<span style="display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:8px;background:#003087;color:#fff"><i data-lucide="check-check" width="19" height="19"></i></span>
<div style="flex:1;min-width:0"><p style="margin:0;font-size:14px;font-weight:600;color:#1e293b">{{ t.reviewTitle }}</p><p style="margin:1px 0 0;font-size:12.5px;line-height:19px;color:#475569;text-wrap:pretty">{{ t.reviewBody }}</p></div>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
<sc-for list="{{ review }}" as="g" hint-placeholder-count="6">
<section style="display:flex;flex-direction:column;gap:11px;border-radius:8px;background:#fff;padding:18px 20px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)">
<div style="display:flex;align-items:center;gap:9px">
<span style="display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:8px;background:#f1f5f9;color:#475569"><i data-lucide="{{ g.icon }}" width="15" height="15"></i></span>
<h2 style="margin:0;flex:1;font-size:14px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ g.title }}</h2>
<button type="button" onClick="{{ g.act }}" style="border:none;background:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.025em;color:#003087;cursor:pointer;text-decoration:underline;text-underline-offset:3px">{{ t.edit }}</button>
</div>
<dl style="margin:0;display:flex;flex-direction:column;gap:7px">
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
<div style="display:flex;align-items:baseline;gap:10px;font-size:12.5px"><dt style="margin:0;flex:none;width:44%;color:#64748b">{{ r.label }}</dt><dd style="margin:0;flex:1;min-width:0;font-weight:500;color:#1e293b;text-wrap:pretty">{{ r.value }}</dd></div>
</sc-for>
</dl>
</section>
</sc-for>
</div>
<section style="display:flex;flex-direction:column;gap:14px;border-radius:8px;background:#fff;padding:20px 22px;box-shadow:0 3px 10px 0 rgba(48,46,56,.06)">
<div><h2 style="margin:0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:.025em;color:#1e293b">{{ t.inviteTitle }}</h2><p style="margin:2px 0 0;font-size:12.5px;line-height:19px;color:#64748b;text-wrap:pretty">{{ t.inviteBody }}</p></div>
<div role="radiogroup" aria-label="{{ t.inviteTitle }}" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<sc-for list="{{ invites }}" as="i" hint-placeholder-count="2">
<sc-if value="{{ i.on }}">
<button type="button" role="radio" aria-checked="true" onClick="{{ i.act }}" style="display:flex;align-items:flex-start;gap:11px;border:1px solid rgba(0,48,135,.25);border-radius:8px;background:rgba(0,48,135,.06);padding:14px 15px;font-family:inherit;text-align:left;cursor:pointer">
<span style="display:grid;place-items:center;width:18px;height:18px;flex:none;margin-top:1px;border:1px solid #003087;border-radius:9999px;background:#fff"><span style="width:9px;height:9px;border-radius:9999px;background:#003087"></span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:13.5px;font-weight:600;color:#1e293b">{{ i.label }}</span><span style="display:block;margin-top:2px;font-size:12px;line-height:18px;color:#64748b;text-wrap:pretty">{{ i.help }}</span></span>
<i data-lucide="{{ i.icon }}" width="17" height="17" style="flex:none;color:#64748b"></i>
</button>
</sc-if>
<sc-if value="{{ i.off }}">
<button type="button" role="radio" aria-checked="false" onClick="{{ i.act }}" style="display:flex;align-items:flex-start;gap:11px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:14px 15px;font-family:inherit;text-align:left;cursor:pointer" style-hover="background:#f8fafc">
<span style="display:grid;place-items:center;width:18px;height:18px;flex:none;margin-top:1px;border:1px solid #cbd5e1;border-radius:9999px;background:#fff"><span style="width:9px;height:9px;border-radius:9999px;background:transparent"></span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:13.5px;font-weight:600;color:#1e293b">{{ i.label }}</span><span style="display:block;margin-top:2px;font-size:12px;line-height:18px;color:#64748b;text-wrap:pretty">{{ i.help }}</span></span>
<i data-lucide="{{ i.icon }}" width="17" height="17" style="flex:none;color:#64748b"></i>
</button>
</sc-if>
</sc-for>
</div>
<div style="display:flex;align-items:flex-start;gap:9px;border-radius:8px;background:#f8fafc;padding:12px 14px">
<i data-lucide="info" width="17" height="17" style="flex:none;margin-top:1px;color:#64748b"></i>
<p style="margin:0;font-size:12.5px;line-height:19px;color:#475569;text-wrap:pretty">{{ t.inviteNote }}</p>
</div>
</section>
</sc-if>
</div>
</div>
<div style="flex:none;display:flex;align-items:center;gap:12px;height:68px;padding:0 24px;border-top:1px solid #e2e8f0;background:#fff;box-shadow:0 -8px 22px -14px rgba(15,23,42,.25)">
<div style="max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px">
<button type="button" onClick="{{ back }}" style="display:inline-flex;align-items:center;gap:7px;height:36px;flex:none;border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.025em;color:#475569;cursor:pointer" style-hover="background:#f1f5f9"><i data-lucide="arrow-left" width="16" height="16"></i>{{ backLabel }}</button>
<p style="margin:0;flex:1;min-width:0;font-size:12.5px;color:#64748b;text-wrap:pretty">{{ footNote }}</p>
<sc-if value="{{ isForm }}">
<button type="button" onClick="{{ next }}" style="display:inline-flex;align-items:center;gap:7px;height:36px;flex:none;border:none;border-radius:8px;background:#003087;padding:0 16px;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.025em;color:#fff;cursor:pointer" style-hover="background:#002a77">{{ t.continue }}<i data-lucide="arrow-right" width="16" height="16"></i></button>
</sc-if>
<sc-if value="{{ isReview }}">
<button type="button" onClick="{{ create }}" style="display:inline-flex;align-items:center;gap:7px;height:36px;flex:none;border:none;border-radius:8px;background:#003087;padding:0 16px;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.025em;color:#fff;cursor:pointer" style-hover="background:#002a77"><i data-lucide="send" width="16" height="16"></i>{{ t.createVerb }}</button>
</sc-if>
</div>
</div>
<sc-if value="{{ done }}">
<div style="position:fixed;inset:0;z-index:220;display:grid;place-items:center;background:rgba(15,23,42,.6);padding:24px">
<div role="dialog" aria-modal="true" aria-label="{{ t.doneTitle }}" style="width:100%;max-width:460px;border-radius:8px;background:#fff;padding:26px;text-align:center;box-shadow:0 26px 60px -20px rgba(15,23,42,.5)">
<span style="display:grid;place-items:center;width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:rgba(16,185,129,.12);color:#047857"><i data-lucide="check" width="28" height="28"></i></span>
<h2 style="margin:0;font-size:17px;font-weight:600;color:#1e293b">{{ t.doneTitle }}</h2>
<p style="margin:7px 0 0;font-size:13px;line-height:20px;color:#64748b;text-wrap:pretty">{{ t.doneBody }}</p>
<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px">
<button type="button" onClick="{{ close }}" style="height:36px;border:none;border-radius:8px;background:#003087;padding:0 16px;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.025em;color:#fff;cursor:pointer" style-hover="background:#002a77">{{ t.doneCta }}</button>
<button type="button" onClick="{{ restart }}" style="height:36px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;padding:0 15px;font-family:inherit;font-size:14px;font-weight:500;letter-spacing:.025em;color:#475569;cursor:pointer" style-hover="background:#f1f5f9">{{ t.addAnother }}</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;bn&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en' | 'bn'&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { step: 0, invite: 'sms', drafted: false, done: false, segs: { nameLang: 'en', employment: 'full', login: 'phone', twoFactor: 'on', checkIn: 'pin', payMethod: 'bkash', carry: 'yes' } };
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() {
    const go = () => { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }); };
    go(); setTimeout(go, 200); setTimeout(go, 700); setTimeout(go, 2000);
  }
  seg(key, opts) {
    return opts.map(([val, label]) => {
      const on = this.state.segs[key] === val;
      return {
        label, on, off: !on,
        act: () => { const s = Object.assign({}, this.state.segs); s[key] = val; this.setState({ segs: s }); }
      };
    });
  }
  renderVals() {
    const bn = (this.props.lang ?? 'en') === 'bn';
    const L = (en, b) => bn ? b : en;
    const step = this.state.step;
    const close = this.props.onClose || (() => {});
    const F = (label, value, opts) => Object.assign({
      label, value: value || '', placeholder: '', help: '', wide: false, req: '',
      isText: true, isSelect: false, isSeg: false, options: [], segs: [], hasHelp: false
    }, opts || {}, { label, value: value || '' });
    const fix = (f) => {
      const out = Object.assign({}, f);
      out.hasHelp = !!out.help;
      out.narrow = !out.wide;
      out.options = (out.options || []).map(label => ({ label }));
      return out;
    };
    const STEP_DEFS = [
      { key: 'personal', label: L('Personal', 'ব্যক্তিগত'), icon: 'user' },
      { key: 'job', label: L('Job', 'চাকরি'), icon: 'briefcase' },
      { key: 'access', label: L('Login and access', 'লগইন ও অ্যাক্সেস'), icon: 'shield-check' },
      { key: 'shift', label: L('Shift and attendance', 'শিফট ও হাজিরা'), icon: 'clock' },
      { key: 'salary', label: L('Salary', 'বেতন'), icon: 'wallet' },
      { key: 'leave', label: L('Leave', 'ছুটি'), icon: 'palmtree' },
      { key: 'review', label: L('Review', 'পর্যালোচনা'), icon: 'check-check' }
    ];
    const SECTIONS = {
      personal: [
        { title: L('Who is joining?', 'কে যোগ দিচ্ছেন?'), help: L('The name goes on receipts, the roster and payslips. Bangla name is used for SMS.', 'নাম রশিদ, রোস্টার ও পে-স্লিপে যাবে। SMS-এ বাংলা নাম ব্যবহার হবে।'), fields: [
          F(L('Full name (English)', 'পুরো নাম (ইংরেজি)'), 'Sadia Akter', { req: L('required', 'আবশ্যক') }),
          F(L('Full name (Bangla)', 'পুরো নাম (বাংলা)'), 'সাদিয়া আক্তার', { help: L('Allow extra width — Bangla runs about 25% longer.', 'বাংলা প্রায় ২৫% বেশি জায়গা নেয়।') }),
          F(L('Mobile number', 'মোবাইল নম্বর'), '+880 1712-660145', { req: L('required', 'আবশ্যক'), help: L('Used for login, OTP and payslip links.', 'লগইন, OTP ও পে-স্লিপ লিংকে ব্যবহৃত।') }),
          F(L('Email', 'ইমেইল'), 'sadia.akter@gmail.com'),
          F(L('Date of birth', 'জন্ম তারিখ'), '14 Nov 2001'),
          F(L('National ID (NID)', 'জাতীয় পরিচয়পত্র'), '19XX XXXX XXXX'),
          F(L('Address', 'ঠিকানা'), 'House 42, Road 8, Dhanmondi, Dhaka 1209', { wide: true }),
          F(L('Emergency contact', 'জরুরি যোগাযোগ'), 'Rahim Akter · +880 1911-XXXXXX', { wide: true, help: L('Name and number of someone the shop can call.', 'দোকান থেকে ফোন করা যাবে এমন কারো নাম ও নম্বর।') })
        ] }
      ],

      footNote: key === 'review' ? L('Nothing is sent until you press Create and send invitation.', 'তৈরি ও আমন্ত্রণ চাপার আগে কিছু পাঠানো হবে না।') : L('You can leave at any step — a draft keeps everything you have entered.', 'যেকোনো ধাপে বেরিয়ে যেতে পারেন — ড্রাফটে সব তথ্য থাকবে।')
    };
  }
}
</script>
</body>
</html>
