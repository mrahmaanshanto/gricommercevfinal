# Netlify builds the Next.js app with its Next.js runtime (detected automatically).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # wholesale switched on for our site (Nayeem approved, 15 Oct 2026); src/lib/edition.js reads it
  NEXT_PUBLIC_WHOLESALE = "true"

# Next.js runtime: serves the app's pages, redirects and server rendering
[[plugins]]
  package = "@netlify/plugin-nextjs"
